<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8ebed">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Phone">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <title>Rotary Phone</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main>
    <header class="page-head">
      <h1>Rotary Phone</h1>
      <a href="/status">Status</a>
    </header>
    {% for section in sections %}
    <h2>{{ section.title }}</h2>
    <ul class="actions">
      {% for action in section.actions %}
      <li>
        <button type="button" data-action="{{ action.id }}">
          <span class="num">{{ action.track }}</span>
          <span class="label">{{ action.label }}</span>
          <span class="key">{% include "icons/" ~ action.icon ~ ".svg" %}</span>
        </button>
      </li>
      {% endfor %}
    </ul>
    {% endfor %}
  </main>
  <div class="stop-bar">
    <button type="button" data-action="{{ stop.id }}">
      {% include "icons/phone-x.svg" %}
      {{ stop.label }}
    </button>
  </div>
  <div class="toast-anchor">
    <div class="toast t-toast" role="status" aria-live="polite"></div>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
