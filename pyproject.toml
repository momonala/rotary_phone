[project]
name = "rotary_phone"
version = "0.1.0"
description = "Mobile web remote that triggers the rotary phone over MQTT"
authors = [{name = "Mohit Nalavadi"}]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "paho-mqtt>=2.1.0",
    "typer>=0.27.3",
]

[tool.config]
flask_port = 5009
domain = "rotary-phone.mnalavadi.org"
mqtt_host = "localhost"
mqtt_port = 1883
mqtt_topic = "home/rotary_phone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rotary_phone"]

[project.scripts]
app = "rotary_phone.web.app:main"
config = "rotary_phone.web.config:main"

[tool.pytest.ini_options]
testpaths = ["rotary_phone/web/tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=rotary_phone/web --cov-report=term-missing"

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
